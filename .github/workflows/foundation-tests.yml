name: Foundation Regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'experiments/**'
      - '.github/workflows/foundation-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'experiments/**'
      - '.github/workflows/foundation-tests.yml'

permissions:
  contents: read

jobs:
  foundation:
    name: clean-checkout-foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned foundation test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          'pydantic==2.13.4' 'pytest==9.0.2'

      - name: Run combined foundation regression
        env:
          FOUNDATION_ARTIFACT_DIR: /tmp/foundation-regression
        run: python experiments/foundation_regression/run_foundation_regression.py

      - name: Upload foundation regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-regression-${{ github.sha }}
          path: /tmp/foundation-regression
          if-no-files-found: warn
