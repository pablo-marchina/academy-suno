name: W009 AI-Only Diagnostic Harness

on:
  pull_request:
    paths:
      - 'experiments/ai_only_w009/**'
      - 'tests/ai_only_w009/**'
      - 'docs/evals/AI_ONLY_W009.md'
      - '.github/workflows/ai-only-w009.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/ai_only_w009/**'
      - 'tests/ai_only_w009/**'
      - 'docs/evals/AI_ONLY_W009.md'
      - '.github/workflows/ai-only-w009.yml'

permissions:
  contents: read

jobs:
  deterministic-ai-only-diag:
    name: w009-deterministic-diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen relevant model contracts
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'pydantic==2.13.4'
      - name: Compile evaluator and tests
        run: python -m py_compile experiments/ai_only_w009/harness.py tests/ai_only_w009/test_harness.py
      - name: Execute synthetic deterministic tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/ai_only_w009 -p 'test_*.py' -v
