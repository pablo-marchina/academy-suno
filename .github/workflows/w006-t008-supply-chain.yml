name: W006 T008 Supply Chain

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'toolchain.lock.json'
      - 'src/**'
      - 'app/**'
      - 'docs/production/contracts/v1/**'
      - 'scripts/supply_chain/**'
      - '.github/workflows/release-smoke-w004-t012.yml'
      - '.github/workflows/w006-t008-supply-chain.yml'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'toolchain.lock.json'
      - 'src/**'
      - 'app/**'
      - 'docs/production/contracts/v1/**'
      - 'scripts/supply_chain/**'
      - '.github/workflows/release-smoke-w004-t012.yml'
      - '.github/workflows/w006-t008-supply-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-evidence:
    name: clean-locked-build-test-sbom-provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up authoritative Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'

      - name: Restore trusted uv cache keyed by lock
        if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-python-3.13.15-uv-0.12.18-${{ hashFiles('uv.lock') }}

      - name: Provision exact package manager
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'uv==0.12.18'

      - name: Verify frozen toolchain and lock integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .python-version)" = '3.13.15'
          test "$(uv --version)" = 'uv 0.12.18 (x86_64-unknown-linux-gnu)'
          echo 'da3c61966965303a03c99b8441b763c169ac3bda71f0a625de236e8047ce1297  uv.lock' | sha256sum -c -
          uv lock --check

      - name: Clean locked install
        env:
          UV_NO_PROGRESS: '1'
        run: uv sync --locked --no-install-project --group test

      - name: Compile accepted Python surfaces
        run: uv run --no-sync python -m compileall -q src tests experiments scripts

      - name: Execute foundation regression from frozen environment
        env:
          FOUNDATION_ARTIFACT_DIR: /tmp/w006-t008-evidence/foundation-regression
        run: uv run --no-sync python experiments/foundation_regression/run_foundation_regression.py

      - name: Audit release Actions and token permissions
        run: >-
          uv run --no-sync python scripts/supply_chain/audit_release_workflows.py
          --output /tmp/w006-t008-evidence/release-workflow-audit.json

      - name: Build deterministic release evidence twice
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/supply_chain/build_release_evidence.py --output-dir /tmp/w006-t008-evidence/release
          uv run --no-sync python scripts/supply_chain/build_release_evidence.py --output-dir /tmp/w006-t008-evidence/release-repeat
          cmp /tmp/w006-t008-evidence/release/academy-suno-source.tar.gz /tmp/w006-t008-evidence/release-repeat/academy-suno-source.tar.gz
          cmp /tmp/w006-t008-evidence/release/academy-suno-source.tar.gz.spdx.json /tmp/w006-t008-evidence/release-repeat/academy-suno-source.tar.gz.spdx.json
          cmp /tmp/w006-t008-evidence/release/academy-suno-source.tar.gz.provenance.json /tmp/w006-t008-evidence/release-repeat/academy-suno-source.tar.gz.provenance.json

      - name: Verify SBOM and local provenance bindings
        run: >-
          uv run --no-sync python scripts/supply_chain/verify_release_evidence.py
          --artifact /tmp/w006-t008-evidence/release/academy-suno-source.tar.gz
          --sbom /tmp/w006-t008-evidence/release/academy-suno-source.tar.gz.spdx.json
          --provenance /tmp/w006-t008-evidence/release/academy-suno-source.tar.gz.provenance.json
          --lockfile uv.lock
          > /tmp/w006-t008-evidence/release-verification.json

      - name: Capture immutable digests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/w006-t008-evidence
          sha256sum \
            release/academy-suno-source.tar.gz \
            release/academy-suno-source.tar.gz.spdx.json \
            release/academy-suno-source.tar.gz.provenance.json \
            > SHA256SUMS

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w006-t008-supply-chain-${{ github.sha }}
          path: /tmp/w006-t008-evidence
          if-no-files-found: error

  attest-artifact:
    name: github-build-provenance-attestation
    needs: build-test-evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: w006-t008-supply-chain-${{ github.sha }}
          path: /tmp/w006-t008-evidence

      - name: Attest release artifact build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: /tmp/w006-t008-evidence/release/academy-suno-source.tar.gz

      - name: Verify GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify \
            /tmp/w006-t008-evidence/release/academy-suno-source.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            | tee /tmp/w006-t008-evidence/attestation-verification.txt

      - name: Upload attestation verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w006-t008-attestation-${{ github.sha }}
          path: /tmp/w006-t008-evidence/attestation-verification.txt
          if-no-files-found: error
