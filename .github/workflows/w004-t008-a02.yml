name: W004 T008 A02 final clean release proof

on:
  push:
    branches: [worker/W004-T008-A02]

permissions:
  contents: write

jobs:
  release-proof:
    if: contains(github.event.head_commit.message, '[RUN_W004_T008_A02]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'pydantic==2.13.4' 'pytest==9.0.2'
      - name: Guardrail tests
        run: python -m pytest -q tests/release_w004/test_t008_a02.py
      - name: Execute attempt-valid final proof
        run: python experiments/release_w004/run_t008_a02.py --workdir /tmp/w004-t008-a02
      - name: Strict acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('experiments/release_w004/runs/W004-T008-A02/release_proof.json').read_text())
          assert r['attempt_id']=='A02' and r['base_state_version']=='0037'
          assert r['status']=='PASS_EVIDENCE_BOUNDED'
          assert r['mechanics']['source_to_9_to_eval_repair_aggregate'] is True
          assert r['mechanics']['job_count']==9 and r['mechanics']['joined_output_count']==9
          assert r['canonical_evidence']['provider_model']['accepted_attempt']=='A05'
          assert r['canonical_evidence']['provider_model']['observed_calls']==8
          assert r['canonical_evidence']['provider_model']['decision']=='NO_OVERALL_MODEL_PREFERENCE'
          assert r['canonical_evidence']['semantic']['decision']=='NO_BACKEND_PREFERENCE'
          assert r['canonical_evidence']['calibration']['human_gold'] is False
          assert r['canonical_evidence']['calibration']['human_agreement'] is False
          assert r['claim_boundaries']['blanket_production_readiness'] is False
          assert r['demo']['sha256']=='c3451658df0a05e69f6d883a9861629a0fe8bef396288b9861d8010e850907e5'
          assert r['demo']['duration_seconds']<=300
          assert len(r['audit']['UNKNOWN_EXTERNAL'])==4
          assert Path('SYSTEM/RESULTS/W004-T008-A02.md').exists()
          print('T008-A02 strict acceptance PASS')
          PY
      - name: Persist CI provenance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('experiments/release_w004/runs/W004-T008-A02/ci_provenance.json')
          p.write_text(json.dumps({'schema_version':'w004-t008-ci-provenance.v2','task_id':'W004-T008','attempt_id':'A02','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'sha':os.environ['GITHUB_SHA'],'blanket_production_readiness_claim':False},indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist accepted evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/release_w004/runs/W004-T008-A02/release_proof.json experiments/release_w004/runs/W004-T008-A02/ci_provenance.json docs/release_w004/W004-T008-A02.md SYSTEM/RESULTS/W004-T008-A02.md
          if ! git diff --cached --quiet; then git commit -m 'W004-T008 A02: persist attempt-valid final release proof'; git push origin HEAD:worker/W004-T008-A02; fi
      - name: Fresh-clone verify
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch worker/W004-T008-A02 "https://github.com/${GITHUB_REPOSITORY}.git" "$tmp/repo"
          cmp experiments/release_w004/runs/W004-T008-A02/release_proof.json "$tmp/repo/experiments/release_w004/runs/W004-T008-A02/release_proof.json"
          cmp SYSTEM/RESULTS/W004-T008-A02.md "$tmp/repo/SYSTEM/RESULTS/W004-T008-A02.md"
      - uses: actions/upload-artifact@v4
        with:
          name: w004-t008-a02-release-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/release_w004/runs/W004-T008-A02/
            docs/release_w004/W004-T008-A02.md
            SYSTEM/RESULTS/W004-T008-A02.md
          retention-days: 90
