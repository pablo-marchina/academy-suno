name: W004 T006 A01 semantic ablation

on:
  push:
    branches:
      - worker/W004-T006-A01

permissions:
  contents: write

jobs:
  ablation:
    if: contains(github.event.head_commit.message, '[RUN_W004_T006_A01]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check 'pydantic>=2,<3'
      - name: Test semantic ablation boundaries
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests/semantic_ablation_w004/test_t006_a01.py -v
      - name: Run paired semantic-off/on experiment
        env:
          PYTHONPATH: src:.
        run: python experiments/semantic_ablation_w004/run_t006_a01.py
      - name: Strict acceptance checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/semantic_ablation_w004/runs/W004-T006-A01/ablation.json')
          r=json.loads(p.read_text())
          assert r['sample_count']==36
          assert r['hard_gate_invariant_all'] is True
          assert r['hard_fail_compensation_count']==0
          assert r['backend_decision']=='NO_BACKEND_PREFERENCE'
          assert r['human_gold_eligible'] is False
          assert r['threshold_disposition']=='DIAGNOSTIC_ONLY'
          assert Path('SYSTEM/RESULTS/W004-T006-A01.md').exists()
          print(json.dumps({'status':'PASS','delta':r['reference_accuracy_delta'],'changed':r['decision_changed_count']}))
          PY
      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/semantic_ablation_w004/runs/W004-T006-A01/ablation.json docs/evals/semantic_ablation_w004/W004-T006-A01.md SYSTEM/RESULTS/W004-T006-A01.md
          if ! git diff --cached --quiet; then
            git commit -m 'W004-T006 A01: persist semantic ablation evidence'
            git push origin HEAD:worker/W004-T006-A01
          fi
      - name: Fresh-clone verify
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch worker/W004-T006-A01 "https://github.com/${GITHUB_REPOSITORY}.git" "$tmp/repo"
          cmp experiments/semantic_ablation_w004/runs/W004-T006-A01/ablation.json "$tmp/repo/experiments/semantic_ablation_w004/runs/W004-T006-A01/ablation.json"
          cmp SYSTEM/RESULTS/W004-T006-A01.md "$tmp/repo/SYSTEM/RESULTS/W004-T006-A01.md"
      - uses: actions/upload-artifact@v4
        with:
          name: w004-t006-a01-semantic-ablation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/semantic_ablation_w004/runs/W004-T006-A01/ablation.json
            docs/evals/semantic_ablation_w004/W004-T006-A01.md
            SYSTEM/RESULTS/W004-T006-A01.md
          retention-days: 30
