name: Render Free Staging Safety

on:
  pull_request:
    paths:
      - 'app/hosting/**'
      - 'tests/hosting/**'
      - '.github/workflows/render-staging-safety.yml'
  push:
    branches:
      - main
    paths:
      - 'app/hosting/**'
      - 'tests/hosting/**'
      - '.github/workflows/render-staging-safety.yml'

permissions:
  contents: read

jobs:
  render-staging-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify contract/status without production credentials
        run: python -m unittest discover -s tests/hosting -p 'test_*.py' -v
