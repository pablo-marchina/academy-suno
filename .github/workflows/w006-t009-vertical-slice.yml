name: W006 T009 Vertical Slice

on:
  pull_request:
    paths:
      - 'src/suno_content/production_slice.py'
      - 'tests/integration/w006/test_vertical_slice.py'
      - 'SYSTEM/RESULTS/W006-T009-A01.md'
      - '.github/workflows/w006-t009-vertical-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-vertical-slice:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked test surface and parser challenger
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'pydantic==2.13.4' \
            'pytest==9.0.2' \
            'jsonschema==4.25.1' \
            'pypdf==5.9.0'
      - name: Compile integration surface
        run: python -m compileall -q src/suno_content/production_slice.py tests/integration/w006/test_vertical_slice.py
      - name: Run W006 T009 vertical slice
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/integration/w006/test_vertical_slice.py
      - name: Run accepted foundation regressions
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/integration/foundation tests/runstore tests/orchestration tests/cockpit tests/ingest
