name: W006 T009 Vertical Slice

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'toolchain.lock.json'
      - 'src/suno_content/production_slice.py'
      - 'src/suno_content/production_observability.py'
      - 'tests/integration/w006/test_vertical_slice.py'
      - 'SYSTEM/RESULTS/W006-T009-A02.md'
      - 'artifacts/w006-t009/a02/**'
      - '.github/workflows/w006-t009-vertical-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-vertical-slice:
    name: exact-locked-reference-vertical-slice
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up authoritative Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'

      - name: Provision exact package manager
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'uv==0.12.18'

      - name: Verify frozen toolchain and committed lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.13.15'
          test "$(cat .python-version)" = '3.13.15'
          test "$(uv --version)" = 'uv 0.12.18 (x86_64-unknown-linux-gnu)'
          uv lock --check
          sha256sum uv.lock pyproject.toml toolchain.lock.json

      - name: Clean frozen install
        env:
          UV_NO_PROGRESS: '1'
        run: uv sync --locked --no-install-project --group test

      - name: Compile vertical-slice and accepted surfaces
        run: >-
          uv run --no-sync python -m compileall -q
          src/suno_content/production_slice.py
          src/suno_content/production_observability.py
          tests/integration/w006/test_vertical_slice.py

      - name: Run W006 T009 vertical slice from frozen environment
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m pytest -q tests/integration/w006/test_vertical_slice.py

      - name: Run accepted regressions from frozen environment
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync python -m pytest -q
          tests/integration/foundation
          tests/runstore
          tests/orchestration
          tests/cockpit
          tests/ingest
