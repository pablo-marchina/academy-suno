name: W006 T014 Final Evidence

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'toolchain.lock.json'
      - 'src/**'
      - 'tests/integration/w006/**'
      - 'experiments/w006_t014_final_audit/**'
      - 'artifacts/w006-t014/a01/**'
      - '.github/workflows/w006-t014-final-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-reference-evidence:
    name: audit-capture-video-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up authoritative Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'

      - name: Provision exact package manager
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'uv==0.12.18'

      - name: Verify frozen toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.13.15'
          test "$(cat .python-version)" = '3.13.15'
          test "$(uv --version)" = 'uv 0.12.18 (x86_64-unknown-linux-gnu)'
          uv lock --check
          sha256sum uv.lock pyproject.toml toolchain.lock.json

      - name: Clean frozen install
        env:
          UV_NO_PROGRESS: '1'
        run: uv sync --locked --no-install-project --group test

      - name: Revalidate accepted real/reference vertical slice
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync python -m pytest -q
          tests/integration/w006/test_vertical_slice.py
          tests/integration/w006/test_observability_live_ops.py

      - name: Execute T014 capture on the same accepted product path
        env:
          PYTHONPATH: src
          W006_T014_PYTHON: '3.13.15'
          W006_T014_UV: '0.12.18'
        run: |
          set -euo pipefail
          rm -rf /tmp/w006-t014-evidence
          mkdir -p /tmp/w006-t014-evidence
          uv run --no-sync python experiments/w006_t014_final_audit/capture_final_demo.py \
            --output-dir /tmp/w006-t014-evidence \
            | tee /tmp/w006-t014-evidence/capture-stdout.json

      - name: Verify video encoder availability
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
          ffmpeg -version | head -n 1

      - name: Render technical video from captured real/reference identities
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/w006-t014-evidence
          font=/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
          rm -f "$out"/segment-*.mp4 "$out"/segments.txt
          i=0
          for slide in "$out"/slides/*.txt; do
            i=$((i + 1))
            seg=$(printf '%s/segment-%02d.mp4' "$out" "$i")
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i 'color=c=0x111827:s=1280x720:r=30:d=30' \
              -vf "drawtext=fontfile=${font}:textfile=${slide}:fontcolor=white:fontsize=27:line_spacing=14:x=70:y=85:box=1:boxcolor=0x111827@0.20:boxborderw=18" \
              -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
              "$seg"
            printf "file '%s'\n" "$seg" >> "$out"/segments.txt
          done
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 \
            -i "$out"/segments.txt -c copy "$out"/w006-t014-a01-final-technical-demo.mp4

      - name: Verify duration identity and bundle digests
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/w006-t014-evidence
          video="$out/w006-t014-a01-final-technical-demo.mp4"
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")
          python - "$duration" "$out/video-verification.json" <<'PY'
          import json
          import sys
          duration = float(sys.argv[1])
          if duration > 300.0:
              raise SystemExit(f"video exceeds 5:00: {duration:.3f}s")
          if duration <= 0:
              raise SystemExit("video duration is not positive")
          payload = {
              "task_id": "W006-T014",
              "attempt_id": "A01",
              "duration_seconds": round(duration, 3),
              "max_seconds": 300,
              "duration_gate": "PASS",
              "source": "same accepted ReferenceVerticalSlice capture produced in this workflow",
              "static_w004_fallback_used": 0,
              "production_ready_claim": "NOT_AUTHORIZED",
              "deploy_identity": "MISSING_PRODUCTION_EVIDENCE"
          }
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(payload, sort_keys=True))
          PY
          sha256sum \
            "$out/demo-capture.json" \
            "$out/capture-summary.txt" \
            "$out/video-verification.json" \
            "$video" \
            > "$out/SHA256SUMS"
          cat "$out/video-verification.json"
          cat "$out/SHA256SUMS"

      - name: Upload final evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w006-t014-a01-final-evidence-${{ github.sha }}
          path: /tmp/w006-t014-evidence
          if-no-files-found: error
