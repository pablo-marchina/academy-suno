name: W004 T004 A07 Groq 403 diagnostics and provider evidence

on:
  push:
    branches:
      - worker/W004-T004-A07

permissions:
  contents: write

jobs:
  provider-evidence:
    if: contains(github.event.head_commit.message, '[RUN_PROVIDER_W004_T004_A07]')
    runs-on: ubuntu-latest
    environment: provider-observed-evidence
    env:
      PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
      RUN_DIR: experiments/provider_w004/runs/W004-T004-A07
      RESULT_PATH: SYSTEM/RESULTS/W004-T004-A07.md
      PRICING_PATH: docs/provider_w004/pricing_snapshot.groq-gpt-oss-a07.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate A07 diagnostic safety before network use
        run: python -m unittest tests/provider_w004/test_run_groq_a07.py -v

      - name: Run diagnostic Groq preflight and at most one bounded generation
        id: probe
        shell: bash
        run: |
          set -u
          mkdir -p "$RUN_DIR"
          set +e
          python experiments/provider_w004/run_groq_a07.py \
            --attempt-id A07 \
            --secret-env PROVIDER_API_KEY \
            --prompt-file experiments/provider_w004/inputs/a07_smoke_prompt.txt \
            --pricing-snapshot "$PRICING_PATH" \
            --timeout 60 \
            --output "$RUN_DIR/provider-probe.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Export and strict-validate downstream mechanics envelope
        id: export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUN_DIR/provider-probe.json" ]]; then
            echo "import_exit=99" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYTHONPATH=experiments/provider_manual python - <<'PY'
          import json, os
          from pathlib import Path
          from provider_evidence import export_probe, write_json
          d=Path(os.environ["RUN_DIR"]); p=json.loads((d/"provider-probe.json").read_text())
          write_json(d/"provider-evidence.json", export_probe(p))
          PY
          set +e
          python experiments/provider_manual/import_provider_evidence.py --input "$RUN_DIR/provider-evidence.json" --output "$RUN_DIR/t007-import.json"
          code=$?
          set -e
          echo "import_exit=$code" >> "$GITHUB_OUTPUT"

      - name: Evaluate A07 and persist RESULT
        id: evaluate
        if: always()
        shell: bash
        env:
          PROBE_EXIT: ${{ steps.probe.outputs.exit_code }}
          IMPORT_EXIT: ${{ steps.export.outputs.import_exit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR" "$(dirname "$RESULT_PATH")"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ["RUN_DIR"]); rp=Path(os.environ["RESULT_PATH"])
          probe=json.loads((d/"provider-probe.json").read_text()) if (d/"provider-probe.json").exists() else {}
          evidence=json.loads((d/"provider-evidence.json").read_text()) if (d/"provider-evidence.json").exists() else {}
          imported=json.loads((d/"t007-import.json").read_text()) if (d/"t007-import.json").exists() else {}
          pf=probe.get("preflight") or {}; err=probe.get("error") or pf.get("error") or {}; usage=probe.get("usage") or {}; cost=probe.get("cost") or {}; pricing=probe.get("pricing_provenance") or {}; response=probe.get("response") or {}
          checks={
            "groq_preflight_authenticated": pf.get("http_status")==200,
            "selected_active_priced_model": probe.get("model") in {"openai/gpt-oss-120b","openai/gpt-oss-20b"} and pf.get("selected_model")==probe.get("model"),
            "observed_run": probe.get("status")=="OBSERVED_RUN",
            "attempt_id_a07": probe.get("attempt_id")=="A07",
            "http_success": probe.get("http_status")==200,
            "usage_observed": usage.get("observed") is True,
            "official_pricing": pricing.get("commercial_evidence_eligible") is True,
            "cost_derived": cost.get("derived") is True and isinstance(cost.get("value"),(int,float)),
            "response_fingerprint": isinstance(response.get("sha256"),str) and len(response.get("sha256", ""))==64,
            "provider_model_observed": response.get("provider_model") not in (None,"","N/A"),
            "t007_mechanics_eligible": (evidence.get("comparison_eligibility") or {}).get("mechanics_eligible_for_t007") is True,
            "strict_import_pass": os.environ.get("IMPORT_EXIT")=="0",
          }
          reasons=[k for k,v in checks.items() if not v]; accepted=not reasons
          summary={"task_id":"W004-T004","attempt_id":"A07","accepted":accepted,"checks":checks,"reasons":reasons,"probe_exit":os.environ.get("PROBE_EXIT"),"import_exit":os.environ.get("IMPORT_EXIT"),"provider":probe.get("provider","N/A"),"model":probe.get("model","N/A"),"preflight":pf,"error":err,"usage":usage,"cost":cost,"pricing_provenance":pricing,"response":response,"t007_import":imported,"workflow_run_id":os.environ.get("GITHUB_RUN_ID","N/A")}
          (d/"acceptance-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          eh=err.get("headers") or {}
          lines=["# RESULT W004-T004-A07","","`TASK_ID: W004-T004`","`ATTEMPT_ID: A07`","`BASE_STATE_VERSION: 0032`","`BASE_COMMIT_SHA: 265b5bc1ccd178092b21cbcb041e2aacf6a0a1f6`","`WORKER_BRANCH: worker/W004-T004-A07`",f"`STATUS: {'COMPLETE' if accepted else 'BLOCKED_OR_FAILED'}`","","## Outcome","",f"- accepted observed provider mechanics: **{str(accepted).upper()}**",f"- provider/model: `{summary['provider']}` / `{summary['model']}`",f"- Models preflight HTTP: `{pf.get('http_status','N/A')}`",f"- preflight latency_ms: `{pf.get('latency_ms','N/A')}`",f"- selected model: `{pf.get('selected_model','N/A')}`",f"- error body kind: `{err.get('body_kind','N/A')}`",f"- error type/code: `{err.get('type','N/A')}` / `{err.get('code','N/A')}`",f"- error message: `{err.get('message','N/A')}`",f"- sanitized body snippet: `{err.get('body_snippet','N/A')}`",f"- response server: `{eh.get('server','N/A')}`",f"- content-type: `{eh.get('content-type','N/A')}`",f"- cf-ray: `{eh.get('cf-ray','N/A')}`",f"- x-request-id: `{eh.get('x-request-id','N/A')}`",f"- generation HTTP: `{probe.get('http_status','N/A')}`",f"- usage: input `{usage.get('input_tokens','N/A')}`, output `{usage.get('output_tokens','N/A')}`, total `{usage.get('total_tokens','N/A')}`",f"- derived cost: `{cost.get('value','N/A')} {cost.get('currency','N/A')}`",f"- pricing source: `{pricing.get('source_url','N/A')}`",f"- T007 mechanics eligible: `{(evidence.get('comparison_eligibility') or {}).get('mechanics_eligible_for_t007',False)}`","","## Acceptance checks",""]
          lines += [f"- {k}: **{'PASS' if v else 'FAIL'}**" for k,v in checks.items()]
          if reasons: lines += ["","## Remaining blocker/failure reasons",""]+[f"- `{x}`" for x in reasons]
          lines += ["","## Evidence posture","","A07 stores only an allowlisted set of response headers and a redacted, length-bounded error body snippet. Authorization/cookie headers and Groq key material are never persisted. Generation occurs only after a 200 Models preflight and active officially-priced candidate selection.","","## Durable artifacts","",f"- `{d}/provider-probe.json`",f"- `{d}/provider-evidence.json`",f"- `{d}/t007-import.json`",f"- `{d}/acceptance-summary.json`"]
          rp.write_text("\n".join(lines)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"accepted={'true' if accepted else 'false'}\n")
          PY

      - name: Persist sanitized evidence to worker branch
        id: persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_DIR" "$RESULT_PATH"
          if git diff --cached --quiet; then echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "W004-T004 A07: persist sanitized Groq diagnostics"
          git push origin HEAD:worker/W004-T004-A07
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fresh-clone accepted evidence and verify byte identity
        id: remote
        if: steps.evaluate.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch worker/W004-T004-A07 "https://github.com/${GITHUB_REPOSITORY}.git" "$tmp/repo"
          for f in provider-probe.json provider-evidence.json t007-import.json acceptance-summary.json; do cmp "$RUN_DIR/$f" "$tmp/repo/$RUN_DIR/$f"; done
          cmp "$RESULT_PATH" "$tmp/repo/$RESULT_PATH"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized A07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w004-t004-a07-groq-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/provider_w004/runs/W004-T004-A07/
            SYSTEM/RESULTS/W004-T004-A07.md
          retention-days: 30

      - name: Enforce terminal acceptance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.evaluate.outputs.accepted }}" == "true" ]]
          [[ "${{ steps.remote.outputs.verified }}" == "true" ]]
