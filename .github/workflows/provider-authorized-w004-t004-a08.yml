name: W004 T004 A08 Groq official-client evidence

on:
  push:
    branches:
      - worker/W004-T004-A08

permissions:
  contents: write

jobs:
  provider-evidence:
    if: contains(github.event.head_commit.message, '[RUN_PROVIDER_W004_T004_A08]')
    runs-on: ubuntu-latest
    environment: provider-observed-evidence
    env:
      PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
      RUN_DIR: experiments/provider_w004/runs/W004-T004-A08
      RESULT_PATH: SYSTEM/RESULTS/W004-T004-A08.md
      PRICING_PATH: docs/provider_w004/pricing_snapshot.groq-gpt-oss-a08.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install provider-documented OpenAI-compatible client
        run: python -m pip install --disable-pip-version-check "openai==2.11.0"

      - name: Validate A08 safety before network use
        run: python -m unittest tests/provider_w004/test_run_groq_a08.py -v

      - name: Run Groq through documented OpenAI-compatible client
        id: probe
        shell: bash
        run: |
          set -u
          mkdir -p "$RUN_DIR"
          set +e
          python experiments/provider_w004/run_groq_a08.py \
            --attempt-id A08 \
            --secret-env PROVIDER_API_KEY \
            --prompt-file experiments/provider_w004/inputs/a08_smoke_prompt.txt \
            --pricing-snapshot "$PRICING_PATH" \
            --timeout 60 \
            --output "$RUN_DIR/provider-probe.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Export and strict-validate downstream mechanics envelope
        id: export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUN_DIR/provider-probe.json" ]]; then
            echo "import_exit=99" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYTHONPATH=experiments/provider_manual python - <<'PY'
          import json, os
          from pathlib import Path
          from provider_evidence import export_probe, write_json
          d=Path(os.environ["RUN_DIR"])
          p=json.loads((d/"provider-probe.json").read_text(encoding="utf-8"))
          write_json(d/"provider-evidence.json", export_probe(p))
          PY
          set +e
          python experiments/provider_manual/import_provider_evidence.py --input "$RUN_DIR/provider-evidence.json" --output "$RUN_DIR/t007-import.json"
          code=$?
          set -e
          echo "import_exit=$code" >> "$GITHUB_OUTPUT"

      - name: Evaluate A08 and persist RESULT
        id: evaluate
        if: always()
        shell: bash
        env:
          PROBE_EXIT: ${{ steps.probe.outputs.exit_code }}
          IMPORT_EXIT: ${{ steps.export.outputs.import_exit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR" "$(dirname "$RESULT_PATH")"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ["RUN_DIR"]); rp=Path(os.environ["RESULT_PATH"])
          probe=json.loads((d/"provider-probe.json").read_text()) if (d/"provider-probe.json").exists() else {}
          evidence=json.loads((d/"provider-evidence.json").read_text()) if (d/"provider-evidence.json").exists() else {}
          imported=json.loads((d/"t007-import.json").read_text()) if (d/"t007-import.json").exists() else {}
          pf=probe.get("preflight") or {}; err=probe.get("error") or pf.get("error") or {}; usage=probe.get("usage") or {}; cost=probe.get("cost") or {}; pricing=probe.get("pricing_provenance") or {}; response=probe.get("response") or {}; transport=probe.get("transport") or {}
          checks={
            "official_client_transport": transport.get("client")=="openai-python",
            "groq_preflight_authenticated": pf.get("http_status")==200,
            "selected_active_priced_model": probe.get("model") in {"openai/gpt-oss-120b","openai/gpt-oss-20b"} and pf.get("selected_model")==probe.get("model"),
            "observed_run": probe.get("status")=="OBSERVED_RUN",
            "attempt_id_a08": probe.get("attempt_id")=="A08",
            "http_success": probe.get("http_status")==200,
            "usage_observed": usage.get("observed") is True,
            "official_pricing": pricing.get("commercial_evidence_eligible") is True,
            "cost_derived": cost.get("derived") is True and isinstance(cost.get("value"),(int,float)),
            "response_fingerprint": isinstance(response.get("sha256"),str) and len(response.get("sha256", ""))==64,
            "provider_model_observed": response.get("provider_model") not in (None,"","N/A"),
            "t007_mechanics_eligible": (evidence.get("comparison_eligibility") or {}).get("mechanics_eligible_for_t007") is True,
            "strict_import_pass": os.environ.get("IMPORT_EXIT")=="0",
          }
          reasons=[k for k,v in checks.items() if not v]; accepted=not reasons
          summary={"task_id":"W004-T004","attempt_id":"A08","accepted":accepted,"checks":checks,"reasons":reasons,"probe_exit":os.environ.get("PROBE_EXIT"),"import_exit":os.environ.get("IMPORT_EXIT"),"provider":probe.get("provider","N/A"),"model":probe.get("model","N/A"),"transport":transport,"preflight":pf,"error":err,"usage":usage,"cost":cost,"pricing_provenance":pricing,"response":response,"t007_import":imported,"workflow_run_id":os.environ.get("GITHUB_RUN_ID","N/A")}
          (d/"acceptance-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          eh=err.get("headers") or {}
          lines=["# RESULT W004-T004-A08","","`TASK_ID: W004-T004`","`ATTEMPT_ID: A08`","`BASE_STATE_VERSION: 0032`","`BASE_COMMIT_SHA: 265b5bc1ccd178092b21cbcb041e2aacf6a0a1f6`","`WORKER_BRANCH: worker/W004-T004-A08`",f"`STATUS: {'COMPLETE' if accepted else 'BLOCKED_OR_FAILED'}`","","## Outcome","",f"- accepted observed provider mechanics: **{str(accepted).upper()}**",f"- transport client/version: `{transport.get('client','N/A')}` / `{transport.get('version','N/A')}`",f"- provider/model: `{summary['provider']}` / `{summary['model']}`",f"- Models preflight HTTP: `{pf.get('http_status','N/A')}`",f"- preflight latency_ms: `{pf.get('latency_ms','N/A')}`",f"- active model count: `{pf.get('active_model_count',0)}`",f"- selected model: `{pf.get('selected_model','N/A')}`",f"- error type/message: `{err.get('type','N/A')}` / `{err.get('message','N/A')}`",f"- error body snippet: `{err.get('body_snippet','N/A')}`",f"- error server/cf-ray: `{eh.get('server','N/A')}` / `{eh.get('cf-ray','N/A')}`",f"- generation HTTP: `{probe.get('http_status','N/A')}`",f"- observed latency_ms: `{probe.get('latency_ms','N/A')}`",f"- usage: input `{usage.get('input_tokens','N/A')}`, output `{usage.get('output_tokens','N/A')}`, total `{usage.get('total_tokens','N/A')}`",f"- derived cost: `{cost.get('value','N/A')} {cost.get('currency','N/A')}`",f"- pricing source: `{pricing.get('source_url','N/A')}`",f"- response SHA-256: `{response.get('sha256','N/A')}`",f"- provider-returned model: `{response.get('provider_model','N/A')}`",f"- T007 mechanics eligible: `{(evidence.get('comparison_eligibility') or {}).get('mechanics_eligible_for_t007',False)}`",f"- strict T007 import exit: `{os.environ.get('IMPORT_EXIT','N/A')}`",f"- GitHub Actions run: `{summary['workflow_run_id']}`","","## Acceptance checks",""]
          lines += [f"- {k}: **{'PASS' if v else 'FAIL'}**" for k,v in checks.items()]
          if reasons: lines += ["","## Remaining blocker/failure reasons",""]+[f"- `{x}`" for x in reasons]
          lines += ["","## Evidence posture","","A08 uses the OpenAI Python client in the Groq-compatible configuration documented by Groq, with no browser-header spoofing. It lists models before generation and performs at most one bounded Responses call only after successful authentication and active priced-model selection. Secret material and raw output text are never persisted.","","## Durable artifacts","",f"- `{d}/provider-probe.json`",f"- `{d}/provider-evidence.json`",f"- `{d}/t007-import.json`",f"- `{d}/acceptance-summary.json`"]
          rp.write_text("\n".join(lines)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"accepted={'true' if accepted else 'false'}\n")
          PY

      - name: Persist sanitized evidence to worker branch
        id: persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_DIR" "$RESULT_PATH"
          if git diff --cached --quiet; then echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "W004-T004 A08: persist sanitized Groq official-client evidence"
          git push origin HEAD:worker/W004-T004-A08
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fresh-clone accepted evidence and verify byte identity
        id: remote
        if: steps.evaluate.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch worker/W004-T004-A08 "https://github.com/${GITHUB_REPOSITORY}.git" "$tmp/repo"
          for f in provider-probe.json provider-evidence.json t007-import.json acceptance-summary.json; do cmp "$RUN_DIR/$f" "$tmp/repo/$RUN_DIR/$f"; done
          cmp "$RESULT_PATH" "$tmp/repo/$RESULT_PATH"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized A08 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w004-t004-a08-groq-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/provider_w004/runs/W004-T004-A08/
            SYSTEM/RESULTS/W004-T004-A08.md
          retention-days: 30

      - name: Enforce terminal acceptance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.evaluate.outputs.accepted }}" == "true" ]]
          [[ "${{ steps.remote.outputs.verified }}" == "true" ]]
