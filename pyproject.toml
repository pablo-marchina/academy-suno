[project]
name = "academy-suno"
version = "0.0.0"
description = "Academy Suno production-evolution reference implementation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.4",
]

[dependency-groups]
test = [
  "jsonschema==4.25.1",
  "pytest==9.0.2",
]
legacy-recipient = [
  "pypdf==5.9.0",
]
runtime-bakeoff = [
  "dbos==2.31.0",
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[tool.academy-suno]
# These declarations separate current accepted repository surfaces from still-open
# production technology choices. Inclusion in this manifest is reproducibility
# scope, not a production runtime/parser/vendor promotion.
authoritative-python = "3.13.15"
production-runtime-lock = "NONE"
production-database-lock = "NONE"
production-parser-lock = "NONE"
node-production-surface = false
